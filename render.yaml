databases:
  - name: cat-fleet-db
    databaseName: cat_fleet_db
    user: cat_fleet_user
    plan: free
    region: oregon

services:
  - type: web
    name: cat-fleet-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        fromDatabase:
          name: cat-fleet-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://smart-rental-fleet-intelligence.vercel.app,https://cat-fleet-backend.onrender.com"
